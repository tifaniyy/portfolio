<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Streamlit UMP Dashboard">
  <title>Streamlit UMP Dashboard</title>

  <rect width="1280" height="800" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1280" height="72" fill="#0F172A"/>
  <circle cx="40" cy="36" r="7" fill="#334155"/>
  <circle cx="64" cy="36" r="7" fill="#334155"/>
  <circle cx="88" cy="36" r="7" fill="#334155"/>
  <rect x="120" y="22" width="520" height="28" rx="8" fill="#1E293B"/>
  <text x="136" y="42" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#94A3B8">Streamlit UMP Dashboard</text>
  <text x="1240" y="42" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600"
        fill="#60A5FA" text-anchor="end">PLACEHOLDER — dashboard streamlit</text>
  <rect x="0" y="72" width="1280" height="728" fill="#FFFFFF"/>
<rect x="40" y="104" width="1200" height="96" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="72" y="152" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">Dashboard UMP Indonesia — Streamlit</text>
  <text x="72" y="180" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748B" text-anchor="start">Visualisasi tren upah minimum provinsi 1997–2025.</text>
  <rect x="40" y="224" width="584" height="128" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="72" y="270" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Trend Line Chart</text>
  <text x="72" y="302" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Tren UMP per provinsi dari tahun ke tahun</text>
  <rect x="656" y="224" width="584" height="128" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="688" y="270" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Bar Chart Comparison</text>
  <text x="688" y="302" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Perbandingan UMP antar provinsi</text>
  <rect x="40" y="374" width="584" height="128" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="72" y="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Data Preprocessing</text>
  <text x="72" y="452" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Pembersihan dan penyiapan data dengan Pandas</text>
  <rect x="656" y="374" width="584" height="128" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="688" y="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start">Interactive Filter</text>
  <text x="688" y="452" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Pemilihan provinsi dan rentang tahun</text>
